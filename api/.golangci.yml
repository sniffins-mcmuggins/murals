version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - bodyclose
    - noctx
    - sqlclosecheck
  exclusions:
    rules:
      - path: internal/openapi/api\.gen\.go
        linters: [errcheck, govet, staticcheck, unused, ineffassign, misspell, bodyclose, noctx, sqlclosecheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sniffins-mcmuggins/render
