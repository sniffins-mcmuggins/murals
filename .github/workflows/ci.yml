name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PATH FILTER ───────────────────────────────────────────────────────────
  # Detects which areas changed so downstream jobs can skip when irrelevant.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'db/**'
            web:
              - 'web/**'
              - 'openapi/**'
            mobile:
              - 'mobile/**'
              - 'openapi/**'
            openapi:
              - 'openapi/**'

  # ── API (Go) ───────────────────────────────────────────────────────────────
  api:
    name: API — lint + test
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum

      - name: Download modules
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: api

      - name: Test
        run: go test ./... -race -count=1

  # ── WEB (Node / Next.js) ──────────────────────────────────────────────────
  web:
    name: Web — lint + test
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  # ── MOBILE (Node / React Native) ──────────────────────────────────────────
  mobile:
    name: Mobile — lint + test
    needs: changes
    if: needs.changes.outputs.mobile == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: '[ "$(npm pkg get devDependencies)" = "{}" ] && echo "No devDependencies – skipping" || npm run lint --if-present'

      - name: Type check
        run: '[ "$(npm pkg get devDependencies)" = "{}" ] && echo "No devDependencies – skipping" || npm run typecheck --if-present'

      - name: Test
        run: '[ "$(npm pkg get devDependencies)" = "{}" ] && echo "No devDependencies – skipping" || npm test --if-present'

  # ── OPENAPI DRIFT CHECK ───────────────────────────────────────────────────
  openapi:
    name: OpenAPI — no drift
    needs: changes
    if: needs.changes.outputs.openapi == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum

      - name: Regenerate
        # task + oapi-codegen are pinned via api/go.mod's tool directive
        # (cached by setup-go). openapi-typescript is run via npx.
        run: go -C api tool task -d "$PWD" openapi:gen

      - name: Check for drift
        run: git diff --exit-code openapi/generated/

  # ── E2E ───────────────────────────────────────────────────────────────────
  e2e:
    name: E2E
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Go (for task)
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Start compose stack
        # task is pinned via api/go.mod's tool directive (cached by setup-go).
        run: go -C api tool task -d "$PWD" up

      - name: Wait for API healthz
        run: timeout 90 bash -c 'until curl -sf http://localhost:8080/healthz; do sleep 3; done'

      - name: Run database migrations
        run: go -C api tool task -d "$PWD" db:migrate

      - name: Run API e2e (fast gate)
        run: go -C api tool task -d "$PWD" e2e:api

      - name: Wait for web service
        run: timeout 300 bash -c 'until curl -sf http://localhost:3000; do sleep 3; done'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser e2e
        run: npx playwright test

      - name: Print compose logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
