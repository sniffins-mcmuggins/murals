              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "402":
          description: Payment required — no active subscription or comp grant.
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                    example: payment_required
                  message:
                    type: string
