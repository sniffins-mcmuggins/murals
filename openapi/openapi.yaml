openapi: "3.0.3"

info:
  title: Render API
  description: REST API for the Render paint festival platform.
  version: "0.1.0"
  contact:
    name: Render
    url: https://renderltd.com

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.renderltd.com
    description: Production

tags:
  - name: health
    description: Service health and readiness
  - name: auth
    description: Authentication and user identity
  - name: images
    description: Image upload pipeline (presign → PUT → confirm)

components:
  schemas:
    Problem:
      description: RFC 7807 problem details object returned on all error responses.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Unprocessable Entity"
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: "email is required"
        instance:
          type: string
          format: uri

    UserRole:
      type: string
      enum: [artist, organiser, admin]

    User:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          minLength: 8
          example: hunter2hunter
        role:
          $ref: "#/components/schemas/UserRole"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT — also set as the session HTTP-only cookie.
        user:
          $ref: "#/components/schemas/User"

    PresignRequest:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
          example: image/jpeg

    PresignResponse:
      type: object
      required: [uploadUrl, s3Key]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned MinIO PUT URL valid for 15 minutes. Client PUTs image bytes directly to this URL — the API server is not in the upload path.
        s3Key:
          type: string
          description: Storage key for the uploaded object. Pass to POST /images/confirm after the PUT succeeds.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890.jpg

    ConfirmRequest:
      type: object
      required: [s3Key]
      properties:
        s3Key:
          type: string
          description: The key returned by POST /images/presign.
        resourceType:
          type: string
          description: Domain resource type this image belongs to (e.g. artist_profile). Association is recorded in E5.
          example: artist_profile
        resourceId:
          type: string
          format: uuid
          description: ID of the owning resource. Recorded in E5.

    ConfirmResponse:
      type: object
      required: [cdnUrl]
      properties:
        cdnUrl:
          type: string
          format: uri
          description: Public URL to the uploaded object. Points to MinIO in dev (CDN_BASE_URL) and CloudFront in production.

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not authorised for this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health check
      description: Returns 200 when the API and database are reachable. Used by docker-compose healthchecks and load balancers.
      tags: [health]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
        "503":
          description: Service is unhealthy (database unreachable).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/signup:
    post:
      operationId: postAuthSignup
      summary: Create a new user account
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate and receive a JWT
      description: Sets an HTTP-only session cookie and returns the token in the body for mobile clients.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      operationId: getMe
      summary: Return the authenticated user
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /images/presign:
    post:
      operationId: postImagesPresign
      summary: Request a presigned PUT URL for direct upload to object storage
      description: |
        Returns a URL the client uses to PUT image bytes directly to MinIO (dev) or S3 (prod).
        The API server is not in the upload data path. URL is valid for 15 minutes.
        Call POST /images/confirm after the PUT succeeds.
      tags: [images]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignRequest"
      responses:
        "200":
          description: Presigned URL issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /images/confirm:
    post:
      operationId: postImagesConfirm
      summary: Confirm a completed upload and receive the CDN URL
      description: |
        Call after successfully PUTting bytes to the presigned URL.
        The server verifies the object exists in storage and returns a public CDN URL.
        Resource association is deferred to E5.
      tags: [images]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "200":
          description: Upload confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
