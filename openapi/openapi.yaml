openapi: "3.0.3"

info:
  title: Render API
  description: REST API for the Render paint festival platform.
  version: "0.1.0"
  contact:
    name: Render
    url: https://renderltd.com

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.renderltd.com
    description: Production

tags:
  - name: health
    description: Service health and readiness
  - name: auth
    description: Authentication and user identity
  - name: images
    description: Image upload pipeline (presign → PUT → confirm)
  - name: artist
    description: Artist profiles, collections, and collection images
  - name: festival
    description: Festival creation, management, applications, and map data

components:
  schemas:
    Problem:
      description: RFC 7807 problem details object returned on all error responses.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Unprocessable Entity"
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: "email is required"
        instance:
          type: string
          format: uri

    User:
      type: object
      required: [id, email, is_admin, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          minLength: 8
          example: hunter2hunter

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT — also set as the session HTTP-only cookie.
        user:
          $ref: "#/components/schemas/User"

    PresignRequest:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
          example: image/jpeg

    PresignResponse:
      type: object
      required: [uploadUrl, s3Key]
      properties:
        uploadUrl:
          type: string
          format: uri
          description: Presigned MinIO PUT URL valid for 15 minutes. Client PUTs image bytes directly to this URL — the API server is not in the upload path.
        s3Key:
          type: string
          description: Storage key for the uploaded object. Pass to POST /images/confirm after the PUT succeeds.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890.jpg

    ConfirmRequest:
      type: object
      required: [s3Key]
      properties:
        s3Key:
          type: string
          description: The key returned by POST /images/presign.
        resourceType:
          type: string
          description: Domain resource type this image belongs to (e.g. artist_profile). Association is recorded in E5.
          example: artist_profile
        resourceId:
          type: string
          format: uuid
          description: ID of the owning resource. Recorded in E5.

    ConfirmResponse:
      type: object
      required: [cdnUrl]
      properties:
        cdnUrl:
          type: string
          format: uri
          description: Public URL to the uploaded object. Points to MinIO in dev (CDN_BASE_URL) and CloudFront in production.

    ArtistProfile:
      type: object
      required: [id, user_id, display_name, bio, medium_tags, social_links, headline_image_urls, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        bio:
          type: string
        location_label:
          type: string
          nullable: true
          description: City/region. Only present if show_location is true (public response).
        medium_tags:
          type: array
          items:
            type: string
          example: ["mural", "stencil"]
        social_links:
          type: object
          additionalProperties:
            type: string
          example: {"instagram": "https://instagram.com/artist"}
        avatar_s3_key:
          type: string
          nullable: true
        headline_image_urls:
          type: array
          items:
            type: string
          description: Ordered list of S3 public URLs for the artist's headline photos.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          example: Alice Muralist

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        locationLabel:
          type: string
          nullable: true
        showLocation:
          type: boolean
          description: Controls whether location_label appears on the public profile.
        mediumTags:
          type: array
          items:
            type: string
        socialLinks:
          type: object
          additionalProperties:
            type: string
        avatarS3Key:
          type: string
          nullable: true

    CollectionStatus:
      type: string
      enum: [active, archived, ongoing]

    Collection:
      type: object
      required: [id, artist_profile_id, name, description, status, display_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        artist_profile_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        cover_s3_key:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CollectionStatus"
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Bristol 2024
        description:
          type: string

    UpdateCollectionRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        coverS3Key:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/CollectionStatus"

    CollectionImage:
      type: object
      required: [id, collection_id, s3_key, cdn_url, display_order, created_at]
      properties:
        id:
          type: string
          format: uuid
        collection_id:
          type: string
          format: uuid
        s3_key:
          type: string
        cdn_url:
          type: string
          format: uri
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time

    AttachImageRequest:
      type: object
      required: [s3Key, cdnUrl]
      properties:
        s3Key:
          type: string
          description: The s3Key returned by POST /images/presign and confirmed via POST /images/confirm.
        cdnUrl:
          type: string
          format: uri
          description: The cdnUrl returned by POST /images/confirm.

    ReorderCollectionsRequest:
      type: object
      required: [collectionIds]
      properties:
        collectionIds:
          type: array
          items:
            type: string
            format: uuid
          description: Ordered list of collection IDs. display_order is set by position (0-indexed).

    ReorderImagesRequest:
      type: object
      required: [imageIds]
      properties:
        imageIds:
          type: array
          items:
            type: string
            format: uuid
          description: Ordered list of image IDs. display_order is set by position (0-indexed).

    FestivalStatus:
      type: string
      enum: [draft, open, live, archived]

    Festival:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organiser_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        location_label:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: "#/components/schemas/FestivalStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationForm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        festival_id:
          type: string
          format: uuid
        fields:
          type: array
          items:
            type: object
        open_at:
          type: string
          format: date-time
          nullable: true
        close_at:
          type: string
          format: date-time
          nullable: true
        max_applications:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationStatus:
      type: string
      enum: [submitted, accepted, declined, waitlisted]

    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        form_id:
          type: string
          format: uuid
        artist_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        rank:
          type: integer
        shortlisted:
          type: boolean
        review_flag:
          type: boolean
        answers:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        artist:
          $ref: "#/components/schemas/ApplicationArtist"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationNote"

    ApplicationArtist:
      type: object
      properties:
        display_name:
          type: string
        avatar_s3_key:
          type: string
          nullable: true
        medium_tags:
          type: array
          items:
            type: string
        location_label:
          type: string
          nullable: true

    ApplicationNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time

    MapPin:
      type: object
      properties:
        artist_id:
          type: string
          format: uuid
          description: Artist profile UUID
        name:
          type: string
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        w3w:
          type: string
          nullable: true

    MapData:
      type: object
      properties:
        pins:
          type: array
          items:
            $ref: "#/components/schemas/MapPin"

    FestivalSpot:
      type: object
      required: [id, number, lat, lng]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        lat:
          type: number
          format: float
        lng:
          type: number
          format: float
        w3w:
          type: string
          nullable: true
        width_m:
          type: number
          format: float
          nullable: true
        height_m:
          type: number
          format: float
          nullable: true
        notes:
          type: string
          nullable: true
        artist_id:
          type: string
          format: uuid
          nullable: true
        artist_name:
          type: string
          nullable: true

    UnassignedArtist:
      type: object
      required: [artist_id, name]
      properties:
        artist_id:
          type: string
          format: uuid
        name:
          type: string

    FestivalSpotsResponse:
      type: object
      required: [spots, unassigned_artists]
      properties:
        spots:
          type: array
          items:
            $ref: "#/components/schemas/FestivalSpot"
        unassigned_artists:
          type: array
          items:
            $ref: "#/components/schemas/UnassignedArtist"

    AcceptedArtist:
      type: object
      properties:
        artist_id:
          type: string
          format: uuid
        name:
          type: string
        pin_lat:
          type: number
          format: float
          nullable: true
        pin_lng:
          type: number
          format: float
          nullable: true
        w3w:
          type: string
          nullable: true

    ProfileListResponse:
      type: object
      required: [profiles, total, page, per_page]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ArtistProfile"
        total:
          type: integer
          description: Total number of profiles.
        page:
          type: integer
          description: Current page number (1-based).
        per_page:
          type: integer
          description: Number of profiles per page.

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not authorised for this action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict — resource already exists.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health check
      description: Returns 200 when the API and database are reachable. Used by docker-compose healthchecks and load balancers.
      tags: [health]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok
        "503":
          description: Service is unhealthy (database unreachable).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/signup:
    post:
      operationId: postAuthSignup
      summary: Create a new user account
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate and receive a JWT
      description: Sets an HTTP-only session cookie and returns the token in the body for mobile clients.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset email
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Reset email sent (returned regardless of whether email exists).

  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password using token from email
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password updated.
        "400":
          description: Invalid or expired token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me:
    get:
      operationId: getMe
      summary: Return the authenticated user
      tags: [auth]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /images/presign:
    post:
      operationId: postImagesPresign
      summary: Request a presigned PUT URL for direct upload to object storage
      description: |
        Returns a URL the client uses to PUT image bytes directly to MinIO (dev) or S3 (prod).
        The API server is not in the upload data path. URL is valid for 15 minutes.
        Call POST /images/confirm after the PUT succeeds.
      tags: [images]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignRequest"
      responses:
        "200":
          description: Presigned URL issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /images/confirm:
    post:
      operationId: postImagesConfirm
      summary: Confirm a completed upload and receive the CDN URL
      description: |
        Call after successfully PUTting bytes to the presigned URL.
        The server verifies the object exists in storage and returns a public CDN URL.
        Resource association is deferred to E5.
      tags: [images]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmRequest"
      responses:
        "200":
          description: Upload confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /profiles:
    post:
      operationId: postProfiles
      summary: Create artist profile
      description: Creates an artist profile for the authenticated user. One profile per user.
      tags: [artist]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /profiles/me:
    get:
      operationId: getProfileMe
      summary: Get own artist profile
      tags: [artist]
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Own profile (includes private fields like show_location setting).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchProfileMe
      summary: Update own artist profile
      tags: [artist]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileID}:
    get:
      operationId: getProfile
      summary: Get public artist profile
      tags: [artist]
      parameters:
        - name: profileID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Public artist profile. location_label is omitted if artist has not enabled show_location.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtistProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /profiles/{profileID}/collections:
    get:
      operationId: listCollections
      summary: List collections for an artist profile
      tags: [artist]
      parameters:
        - name: profileID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of collections ordered by display_order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"

  /collections:
    post:
      operationId: postCollections
      summary: Create a collection
      description: Creates a collection for the authenticated artist's profile. Requires an existing artist profile.
      tags: [artist]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/order:
    put:
      operationId: reorderCollections
      summary: Reorder collections
      description: |
        Accepts an ordered array of collection IDs belonging to the authenticated artist.
        Sets display_order by position (0-indexed). Returns 204 on success.
      tags: [artist]
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderCollectionsRequest"
      responses:
        "204":
          description: Order saved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /collections/{collectionID}:
    get:
      operationId: getCollection
      summary: Get a collection
      tags: [artist]
      parameters:
        - name: collectionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchCollection
      summary: Update a collection
      tags: [artist]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: collectionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Updated collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCollection
      summary: Delete a collection
      tags: [artist]
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: collectionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /collections/{collectionID}/images:
    get:
