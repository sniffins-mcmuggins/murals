services:

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ../api
      target: dev
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://render:render@db:5432/render?sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-renderdev}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-renderdev123}"
      MINIO_BUCKET: "${MINIO_BUCKET:-render-images}"
      MINIO_USE_SSL: "false"
      CDN_BASE_URL: "http://localhost:9000/render-images"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-in-prod}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
    volumes:
      - ../api:/app
      - api_tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── WEB ────────────────────────────────────────────────────────────────────
  web:
    build:
      context: ../web
      target: dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      API_URL: "http://api:8080"
      NODE_ENV: "development"
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api
    restart: unless-stopped

  # ── DATABASE ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: render
      POSTGRES_PASSWORD: render
      POSTGRES_DB: render
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U render -d render"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── MINIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-renderdev}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-renderdev123}"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── MINIO INIT ─────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-renderdev}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-renderdev123}"
      MINIO_BUCKET: "${MINIO_BUCKET:-render-images}"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        mc anonymous set download local/$$MINIO_BUCKET &&
        echo 'MinIO bucket ready'
      "
    restart: "no"

  # ── PROMETHEUS ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    restart: unless-stopped

volumes:
  db_data:
  minio_data:
  prometheus_data:
  api_tmp:
  web_node_modules:
  web_next:
