# Reusable application-form field set (CPF + Upfest share the same shape so the
# apply demo clips work against either festival). Field ids are answer keys — never rename.
festivals:
  # ── CPF 2027 ────────────────────────────────────────────────────────────────
  # Lady Gabe OWNS this one (owner: featured) so logging in as her shows the full
  # organiser side: dashboard, application board, review round, map editor.
  # status: live so the public map renders her accepted artists' pins.
  #
  # Applicant mix (matches the "decided + a few open" demo state):
  #   - Kit / Tomás / Amara / Rosa  → submitted, undecided  (decide live on camera;
  #                                    also what the recorded organiser clips drive)
  #   - Priya / Elena / Jonah       → accepted, pinned on the live map
  #   - Carl                        → declined
  #   - Mara                        → waitlisted
  - slug: cpf-2027
    name: Cheltenham Paint Festival 2027
    description: "The UK's premier paint festival returns for 2027. Eight days of live mural creation across the town centre."
    location: Cheltenham, UK
    start_date: "2027-10-10"
    end_date: "2027-10-17"
    status: live
    owner: featured
    center_lat: 51.8994
    center_lng: -2.0783

    endorsements_for_featured_artist:
      - kind: peer
        from_artist: Amara Diallo
        body: "Gabe's colour work is fearless. I've watched her take a blank gable end and turn it into the best thing on the street. A real one."
        skills: [colour, composition]

    application_form:
      fields:
        - id: f1
          type: textarea
          label: Describe your proposed mural concept
          required: true
        - id: f2
          type: select
          label: Preferred wall size
          options: ["Small (up to 4m²)", "Medium (4–20m²)", "Large (20m²+)"]
          required: true
        - id: f3
          type: select
          label: Primary medium
          options: [Spray paint, Brush, Mixed media, Roller]
          required: true
        - id: f5
          type: select
          label: Do you have public liability insurance?
          options: [Yes, No, In progress]
          required: true
        - id: f6
          type: select
          label: "Full festival availability (10–17 October)?"
          options: ["Full period", "Partial — specify below"]
          required: true
        - id: f7
          type: select
          label: Previous outdoor mural experience
          options: [Yes, No]
          required: false
        - id: f8
          type: textarea
          label: "Anything else you'd like to tell us?"
          required: false
        - id: link_instagram
          type: text
          label: Instagram
          required: false
          prefill: social.instagram
        - id: link_twitter
          type: text
          label: X / Twitter
          required: false
          prefill: social.twitter
        - id: link_facebook
          type: text
          label: Facebook
          required: false
          prefill: social.facebook
        - id: link_youtube
          type: text
          label: YouTube
          required: false
          prefill: social.youtube
        - id: link_tiktok
          type: text
          label: TikTok
          required: false
          prefill: social.tiktok
        - id: link_linkedin
          type: text
          label: LinkedIn
          required: false
          prefill: social.linkedin
        - id: link_pinterest
          type: text
          label: Pinterest
          required: false
          prefill: social.pinterest
        - id: link_website
          type: text
          label: Website
          required: false
          prefill: website

    reviewer_email: sophie@cpf-reviewer.art

    applicants:
      # ── Undecided — submitted (decide these live; recorded clips drive these too) ──
