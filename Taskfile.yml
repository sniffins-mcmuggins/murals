version: '3'

includes:
  api:
    taskfile: ./api/Taskfile.yml
    dir: ./api
  db:
    taskfile: ./db/Taskfile.yml
    dir: ./db
  openapi:
    taskfile: ./openapi/Taskfile.yml
    dir: ./openapi
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web
  mobile:
    taskfile: ./mobile/Taskfile.yml
    dir: ./mobile

vars:
  COMPOSE_FILE: infra/docker-compose.yml

tasks:
  up:
    desc: "Start the full local stack (detached)"
    cmd: docker compose -f {{.COMPOSE_FILE}} up -d

  down:
    desc: "Stop the local stack"
    cmd: docker compose -f {{.COMPOSE_FILE}} down

  test:
    desc: "Run all tests (api, web, mobile, openapi in parallel)"
    deps: [api:test, web:test, mobile:test, openapi:test]

  lint:
    desc: "Run all linters (api, web, mobile in parallel)"
    deps: [api:lint, web:lint, mobile:lint]

  generate:
    desc: "Run all code generators (openapi + sqlc)"
    deps: [openapi:gen, db:generate]

  e2e:api:
    desc: "Run API e2e tests — no browser, fast (requires stack to be up)"
    cmd: npx vitest run --config vitest.e2e.config.ts

  e2e:
    desc: "Run all e2e tests — API gate first, then browser (requires stack to be up)"
    cmds:
      - task: e2e:api
      - cmd: npx playwright test
