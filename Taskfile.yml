version: "3"

includes:
  api:
    taskfile: ./api/Taskfile.yml
    dir: ./api
  db:
    taskfile: ./db/Taskfile.yml
    dir: ./db
  openapi:
    taskfile: ./openapi/Taskfile.yml
    dir: ./openapi
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web
  mobile:
    taskfile: ./mobile/Taskfile.yml
    dir: ./mobile

vars:
  COMPOSE_FILE: infra/docker-compose.yml

tasks:
  up:
    desc: "Start the full local stack (detached)"
    cmd: docker compose -f {{.COMPOSE_FILE}} up -d

  down:
    desc: "Stop the local stack"
    cmd: docker compose -f {{.COMPOSE_FILE}} down -t 2

  test:
    desc: "Run all tests (api, web, mobile, openapi in parallel)"
    deps: [api:test, web:test, mobile:test, openapi:test]

  lint:
    desc: "Run all linters (api, web, mobile in parallel)"
    deps: [api:lint, web:lint, mobile:lint]

  generate:
    desc: "Run all code generators (openapi + sqlc)"
    deps: [openapi:gen, db:generate]

  e2e:api:
    desc: "Run API e2e tests — no browser, fast (requires stack to be up)"
    cmd: npx vitest run --config vitest.e2e.config.ts

  e2e:
    desc: "Run all e2e tests — API gate first, then browser (requires stack to be up)"
    cmds:
      - task: e2e:api
      - cmd: npx playwright test

  e2e:clean:
    desc: "Full clean e2e run — wipe stack + volumes, fresh start, run all tests, always tear down"
    cmds:
      # -v wipes the db/minio volumes so db:migrate runs against a clean schema.
      # Without it a drifted volume (version recorded but tables missing) makes
      # db:migrate a silent no-op and the stack serves a broken schema.
      - docker compose -f {{.COMPOSE_FILE}} down -v -t 2
      - docker compose -f {{.COMPOSE_FILE}} up -d --build
      - defer: { task: down }
      - task: db:migrate
      - bash -c 'n=0; until curl -sf http://localhost:8080/healthz >/dev/null 2>&1; do sleep 2; n=$((n+1)); [ $n -ge 30 ] && echo "API did not become ready" && exit 1; done; echo "API ready"'
      - bash -c 'n=0; until curl -sf http://localhost:3000 >/dev/null 2>&1; do sleep 2; n=$((n+1)); [ $n -ge 60 ] && echo "Web did not become ready" && exit 1; done; echo "Web ready"'
      - task: e2e

  hooks:install:
    desc: "Install git hooks via lefthook (run once after cloning)"
    cmd: go tool lefthook install

  billing:stripe-listen:
    desc: "Forward Stripe webhooks to local API (requires Stripe CLI installed and logged in)"
    cmd: stripe listen --forward-to localhost:8080/billing/webhook

  demo:seed:
    desc: "Wipe and re-seed the demo database (idempotent)"
    dir: demos/seed
    # run: always — so re-seeding actually re-runs before every clip in demo:all
    # (Task otherwise dedups a dep to once per execution). Several organiser clips
    # mutate festival state off-screen, so each clip must start from a clean seed.
    run: always
    cmd: go run .

  demo:record:
    desc: "Re-seed then record one clip. Usage: task demo:record V=artist-signup"
    dir: demos
    # Always re-seed first: the organiser clips advance the festival's review round
    # / decisions / spots, so a clip run against dirty state would fail. Seed = reset.
    deps: [demo:seed]
    cmd: npx playwright test scripts/{{.V}}*.ts --config playwright.config.ts --output=output/raw/{{.V}}

  demo:convert:
    desc: "Convert all recorded .webm files to MP4 (requires ffmpeg)"
    dir: demos
    cmd: bash run.sh

  demo:all:
    desc: "Record every per-feature clip (artist + organiser), each re-seeding first, then convert to MP4."
    cmds:
      - for:
          - artist-onboarding
          - artist-public-profile
          - artist-collections
          - artist-apply-to-festival
          - artist-apply-with-profile
          - artist-endorsements
          - artist-analytics
          - organiser-form-builder
          - organiser-review
          - organiser-decisions-release
          - organiser-map-editor
        task: demo:record
        vars: { V: '{{ .ITEM }}' }
      - task: demo:convert
